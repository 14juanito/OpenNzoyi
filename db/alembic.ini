# Alembic configuration for NZOYI.
# The database URL is injected at runtime from NZOYI_DATABASE_URL / DATABASE_URL
# by env.py (never hard-coded here — convention NZOYI_<COMPONENT>_<PARAM>).
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
